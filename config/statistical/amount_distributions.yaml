# =============================================================================
# Amount Distribution Parameters Configuration
# =============================================================================
#
# Configuration file defining log-normal distribution parameters for ERP
# transaction amounts, customer order size tiers, rounding rules, and
# discount logic.
#
# Consumed by: app/statistical/amount_distributions.py
#   - AmountDistribution class
#   - AmountConfig Pydantic V2 model
#
# Feature: F-006 (Statistical Models)
# Source:  README.md lines 512-538, AAP Section 0.1.1
#
# IMPORTANT: All parameter values are MANDATORY and sourced directly from
# the project specification. Do not alter, round, or approximate any value.
# =============================================================================

# -----------------------------------------------------------------------------
# Purchase Order Amount Distribution
# -----------------------------------------------------------------------------
# Log-normal distribution for purchase order amounts.
# Maps to scipy.stats.lognorm(s=1.2, scale=5000)
# Generates realistic PO amounts with mean ~$5,000 and right-skewed tail.
# Source: README.md lines 518-520
purchase_orders:
  distribution_type: "lognormal"       # Maps to scipy.stats.lognorm
  s: 1.2                               # Shape parameter (sigma of underlying normal)
  scale: 5000                          # Scale parameter ($5,000 = exp(mu))
  min_amount: 100                      # Minimum PO amount ($100)
  max_amount: 500000                   # Maximum PO amount ($500,000)
  description: "Log-normal distribution for purchase order amounts"

# -----------------------------------------------------------------------------
# Vendor Invoice Amount Distribution
# -----------------------------------------------------------------------------
# Vendor invoices are derived from PO amounts. 95% match the PO exactly,
# while 5% have quantity or price variances within ±5%.
# Source: README.md lines 522-524
vendor_invoices:
  match_rate: 0.95                     # 95% of invoices match PO amount exactly
  variance_rate: 0.05                  # 5% have variances (quantity or price differences)
  variance_pct: 0.05                   # Variance range is ±5% of PO amount
  description: "95% match PO amount; 5% have variances within ±5%"

# -----------------------------------------------------------------------------
# Customer Order Size Tiers
# -----------------------------------------------------------------------------
# Customer orders use log-normal distributions parameterized by customer
# size tier. Each tier has its own shape, scale, and amount boundaries.
# Source: README.md lines 526-528
customer_orders:
  distribution_type: "lognormal"       # All tiers use log-normal distribution
  default_tier: "medium"               # Fallback tier when customer tier is unspecified
  tiers:
    small:
      min_amount: 500                  # Minimum $500
      max_amount: 5000                 # Maximum $5,000
      s: 0.8                           # Shape parameter (smaller variance for small orders)
      scale: 1500                      # Scale parameter
      description: "Small customer orders ($500-$5K)"
    medium:
      min_amount: 2000                 # Minimum $2,000
      max_amount: 50000                # Maximum $50,000
      s: 1.0                           # Shape parameter
      scale: 8000                      # Scale parameter
      description: "Medium customer orders ($2K-$50K)"
    large:
      min_amount: 10000                # Minimum $10,000
      max_amount: 500000               # Maximum $500,000
      s: 1.2                           # Shape parameter (larger variance matching PO distribution)
      scale: 50000                     # Scale parameter
      description: "Large customer orders ($10K-$500K)"

# -----------------------------------------------------------------------------
# Rounding Rules
# -----------------------------------------------------------------------------
# Threshold-based rounding rules applied to generated amounts to produce
# realistic round-number values. Rules are evaluated in ascending order
# by threshold; the first matching rule is applied.
# Examples from spec: $4,847.32 → $4,800; $124,389 → $125,000
# Source: README.md lines 530-533
rounding:
  enabled: true
  rules:
    - threshold: 1000                  # Amounts below $1,000
      precision: 10                    # Round to nearest $10
      description: "Round amounts under $1K to nearest $10"
    - threshold: 10000                 # Amounts below $10,000
      precision: 100                   # Round to nearest $100 (e.g., $4,847.32 → $4,800)
      description: "Round amounts under $10K to nearest $100"
    - threshold: 100000                # Amounts below $100,000
      precision: 1000                  # Round to nearest $1,000 (e.g., $124,389 → $125,000)
      description: "Round amounts under $100K to nearest $1,000"
    # Catch-all rule: applies to amounts >= $100,000 (everything not matched above)
    - threshold: 999999999             # Catch-all for amounts $100,000 and above
      precision: 5000                  # Round to nearest $5,000
      description: "Round amounts $100K+ to nearest $5,000"
  min_rounded_amount: 100              # Rounding never produces amount below minimum

# -----------------------------------------------------------------------------
# Discount Logic
# -----------------------------------------------------------------------------
# Payment discount terms available for vendor invoices and purchase orders.
# The default_terms value specifies the most common discount arrangement.
# Source: README.md lines 535-537
discounts:
  default_terms: "2/10 Net 30"         # Standard discount terms
  terms:
    "2/10 Net 30":
      discount_rate: 0.02              # 2% discount
      discount_days: 10                # Discount applies if paid within 10 days
      net_days: 30                     # Full payment due in 30 days
      description: "2% discount if paid within 10 days, net 30 days"
    "1/10 Net 30":
      discount_rate: 0.01              # 1% discount
      discount_days: 10                # Discount applies if paid within 10 days
      net_days: 30                     # Full payment due in 30 days
      description: "1% discount if paid within 10 days, net 30 days"
    "Net 30":
      discount_rate: 0.0               # No discount
      discount_days: 0                 # No discount period
      net_days: 30                     # Full payment due in 30 days
      description: "No discount, net 30 days"
    "Net 60":
      discount_rate: 0.0               # No discount
      discount_days: 0                 # No discount period
      net_days: 60                     # Full payment due in 60 days
      description: "No discount, net 60 days"
    "Due on Receipt":
      discount_rate: 0.0               # No discount
      discount_days: 0                 # No discount period
      net_days: 0                      # Payment due immediately
      description: "Payment due immediately"

# -----------------------------------------------------------------------------
# Global Amount Constraints
# -----------------------------------------------------------------------------
# Absolute bounds enforced across all transaction types. No generated amount
# may fall outside these boundaries regardless of distribution parameters.
# Source: AAP Section 0.1.1 ("min $100, max $500K")
global_constraints:
  absolute_min_amount: 100             # No transaction below $100
  absolute_max_amount: 500000          # No transaction above $500,000
  currency: "USD"                      # All amounts in US Dollars
