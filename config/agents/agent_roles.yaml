        max: 0.4
        default: 0.3
      efficiency:
        min: 0.5
        max: 0.8
        default: 0.6
      compliance:
        min: 0.7
        max: 1.0
        default: 0.8

    work_hours_start: 8
    work_hours_end: 17

    temperature: 0.5
    max_tokens: 1000

    capabilities:
      - process_vendor_invoice
      - match_three_way
      - schedule_payment

    permissions:
      can_approve: false
      approval_limit: null
      can_create: true
      can_modify: false

