# =============================================================================
# Agent Role Definitions for Synthetic ERP Data Generation Platform
# =============================================================================
#
# Consumed by:
#   - app/agents/agent_config.py  (AgentConfig construction from role templates)
#   - app/agents/agent_registry.py (agent instantiation and role-based lookup)
#
# This file defines all 12 specialized agent roles spanning 6 ERP functional
# areas: Accounts Payable, Accounts Receivable, Purchasing, Warehouse,
# Accounting, and Financial Control.
#
# Personality Trait Scale:
#   Each trait is a float from 0.0 to 1.0 with min/max range and default.
#   - thoroughness:   How detail-oriented the agent is (0=cursory, 1=meticulous)
#   - risk_tolerance: Willingness to accept uncertainty (0=risk-averse, 1=risk-seeking)
#   - efficiency:     Speed vs. thoroughness tradeoff (0=slow/thorough, 1=fast/pragmatic)
#   - compliance:     Adherence to rules and procedures (0=flexible, 1=strict)
#
#   In LLM prompts, traits are displayed as {trait}/10 (e.g., thoroughness 0.7 -> 7/10).
#
# Capabilities:
#   Each role lists actions from the 14-action registry it can perform:
#     create_purchase_order, approve_purchase_order, receive_goods,
#     process_vendor_invoice, match_three_way, approve_invoice,
#     schedule_payment, create_sales_order, ship_order,
#     create_customer_invoice, apply_payment, create_journal_entry,
#     reconcile_account, close_period
#
# Permissions:
#   - can_approve:    Whether the agent can approve transactions
#   - approval_limit: Maximum dollar amount the agent can approve (null = unlimited)
#   - can_create:     Whether the agent can create new transactions
#   - can_modify:     Whether the agent can modify existing transactions
# =============================================================================

roles:

