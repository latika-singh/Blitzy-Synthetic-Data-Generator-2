[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short --strict-markers
markers =
    asyncio: async test marker
    slow: tests that take more than 5 seconds
    integration: tests requiring external services (Redis, LLM APIs)
log_cli = true
log_cli_level = INFO
